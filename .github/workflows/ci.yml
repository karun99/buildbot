name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: API tests & import-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install API
        run: |
          python -m pip install --upgrade pip
          pip install -r api/python/requirements.txt
          pip install pytest
      - name: Byte-compile
        run: python -m compileall -q api/python main.py
      - name: Run tests
        run: python -m pytest tests -q
      - name: Import application
        run: |
          python -c "import sys; sys.path.insert(0, 'api/python'); import main; print(main.app.title)"

  node:
    name: Worker syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check worker
        run: node --check api/node/freebuff.js
